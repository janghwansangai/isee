[package]
name = "isee-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.17"
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
jpeg-encoder = "0.7.1"
kamadak-exif = "0.6.1"
lru = "0.19.0"
natord = "1.0.9"
parking_lot = "0.13.0"
rayon = "1.12.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tract-onnx = "0.23.9"
webp = "0.3.1"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zune-jpeg = "0.5.15"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
# 한글 경로 표기(NFC/NFD) 맞추기. 앱(url → idna)이 이미 쓰는 것이라 새로 늘지 않는다.
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
objc2 = "0.6.5"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quick-look-thumbnailing = "0.3.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "5.2.9"
