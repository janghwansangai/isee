# 올릴 때마다: 맥·윈도우에서 엔진 테스트와 앱 빌드 확인 (윈도우 전용 코드가 깨지지 않았는지)
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - name: 화면 빌드 (앱 빌드에 필요)
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build
      - name: 엔진 테스트
        run: cargo test -p isee-core
      - name: 앱 빌드 확인
        run: cargo check -p isee-app
